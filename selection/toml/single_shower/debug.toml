[parameters]
photon_threshold = 20.0
photon_low = 10.0
electron_threshold = 10.0
electron_low = 1.0
muon_threshold = 100.0
muon_low = 1.0
pion_threshold = 130.0
pion_low = 1.0
proton_threshold = 25.0
proton_low = 1.0
containment_margin = 1.0
mctruth_threshold = 0.0  # KE threshold (MeV) for the GENIE-level *_srtruth counters



[general]
output = "/exp/sbnd/data/users/mdonnach/medulla_produce/inclusive_1g/test_new_definition/selection_AR23.root"
primfn = "default_primary_classification"
pidfn = "default_pid"
fsthresh = [
    "@photon_threshold",
    "@electron_threshold",
    "@muon_threshold",
    "@pion_threshold",
    "@proton_threshold",
]

#[[include_samples]]
#file = "common/osc.toml"
#keys = [
#    "sbnd_ar23p_mc5e18"
#]
#enable = [
#    "sbnd_ar23p_mc5e18"
#]


# SBND sample
[[sample]]
name = "simulation"
path = "/pnfs/sbnd/persistent/users/mueller/MCP2025B/simulation/mc5e18/input*-reweighted.flat.caf.root"
#path = "/pnfs/sbnd/persistent/users/mueller/MCP2025B/simulation/mc5e18/input000-reweighted.flat.caf.root"
ismc = true
disable = false # Optional: default = falses



[[tree]]  #True single photon selection
name = "single_photon_true"
sim_only = true
add_systematics = false
mode = "true"
cut = [
    { name = "single_photon",              type = "true",  parameters = [ "@photon_threshold"  ] },
    { name = "no_electrons",                  type = "true",  parameters = [ "@electron_threshold" ]},
    { name = "no_neutral_pions",                        type = "mctruth"} ,
    { name = "neutrino",                                type = "true"},

]
branch = [
    #mctruth
    { name = "cc",                             type = "mctruth" },
]
