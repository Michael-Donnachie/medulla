[parameters]
photon_threshold = 20.0
photon_low = 10.0
electron_threshold = 10.0
electron_low = 1.0
muon_threshold = 100.0
muon_low = 1.0
pion_threshold = 130.0
pion_low = 1.0
proton_threshold = 25.0
proton_low = 1.0
containment_margin = 3.0


[general]
output = "/exp/sbnd/data/users/mdonnach/medulla_produce/single_photon_v2/MicroBooNE_match/selection"
#output = "/pnfs/sbnd/scratch/users/mdonnach/single_shower_1e20_reweighted_output/single_shower_v2_rewighted_1e20"
primfn = "default_primary_classification"
pidfn = "default_pid"
fsthresh = [
    "@photon_threshold",
    "@electron_threshold",
    "@muon_threshold",
    "@pion_threshold",
    "@proton_threshold",
]

# SBND sample
[[sample]]
name = "simulation"
path = "/pnfs/sbnd/persistent/users/mueller/MCP2025B/simulation/mc5e18/input*-reweighted.flat.caf.root"
ismc = true
disable = false # Optional: default = falses


[[tree]]  #True single photon selection
name = "photon_true_neutrino"
sim_only = true
mode = "true"
cut = [
    { name = "single_photon_observed_cut",              type = "true",  parameters = [ "@photon_threshold"  ] },
    { name = "no_electrons",                            type = "true",  parameters = [ "@electron_threshold" ]},
    { name = "no_muon_inclusive",                       type = "true",  parameters = [ "@muon_threshold" ]},
    { name = "contained_fip_cut",                       type = "true",  parameters = [ "@containment_margin" ]},
    { name = "neutrino",                                type = "true"}
]
branch = [
    #mctruth
    { name = "cc",                             type = "mctruth" },
    { name = "interaction_mode",               type = "mctruth" },
    { name = "interaction_type",               type = "mctruth" },

    #interaction
    { name = "interaction_id",                          type = "both"},
    { name = "photon_multiplicity_inclusive",           type = "both", parameters = [ "@photon_threshold" ]},
    { name = "photon_depot_multiplicity_inclusive",     type = "both", parameters = [ "@photon_threshold" ]},
    { name = "electron_multiplicity_inclusive",         type = "both", parameters = [ "@electron_threshold" ]},
    { name = "pion_multiplicity_inclusive",             type = "both", parameters = [ "@pion_threshold" ]},
    { name = "proton_multiplicity_inclusive",           type = "both", parameters = [ "@proton_threshold" ]},
    { name = "muon_multiplicity_inclusive",             type = "both", parameters = [ "@muon_threshold" ]},
    { name = "electron_multiplicity_inclusive_low",     type = "both", parameters = [ "@electron_low" ]},
    { name = "pion_multiplicity_inclusive_low",         type = "both", parameters = [ "@pion_low" ]},
    { name = "proton_multiplicity_inclusive_low",       type = "both", parameters = [ "@proton_low" ]},
    { name = "muon_multiplicity_inclusive_low",         type = "both", parameters = [ "@muon_low" ]},
    { name = "category",                                type = "true"},
    { name = "single_photon_observed_cut",              type = "both",  parameters = [ "@photon_threshold"  ] },
    { name = "no_electrons_inclusive",                  type = "both",  parameters = [ "@electron_threshold" ]},
    { name = "no_charged_pions_inclusive",              type = "both",  parameters = [ "@pion_threshold" ]},
    { name = "no_muon_inclusive",                       type = "both",  parameters = [ "@muon_threshold" ]},
    { name = "neutrino",                                type = "true"},
    { name = "is_dirt" ,                                type = "true"},
    { name = "contained_fip_cut",                       type = "both", parameters = [ "@containment_margin" ]},    
    #positioning
    { name = "vertex_x",            type = "both"},    
    { name = "vertex_y",            type = "both"},
    { name = "vertex_z",            type = "both"},
    { name = "shower_opening_angle",type = "both"},

    #leading shower
    #energy
    { name = "ke",                  type = "both_particle",     selector = "leading_shower" },
    { name = "total_depositions",   type = "both_particle",     selector = "leading_shower"},
    { name = "p",                   type = "both_particle",     selector = "leading_shower"},
    { name = "px",                  type = "both_particle",     selector = "leading_shower"},
    { name = "py",                  type = "both_particle",     selector = "leading_shower"},
    { name = "pz",                  type = "both_particle",     selector = "leading_shower"},
    { name = "start_dedx",          type = "reco_particle",     selector = "leading_shower"},
    #positioning
    { name = "start_x",             type = "both_particle",     selector = "leading_shower" },
    { name = "start_y",             type = "both_particle",     selector = "leading_shower" },
    { name = "start_z",             type = "both_particle",     selector = "leading_shower" },
    { name = "end_x",               type = "both_particle",     selector = "leading_shower" },
    { name = "end_y",               type = "both_particle",     selector = "leading_shower" },
    { name = "end_z",               type = "both_particle",     selector = "leading_shower" },
    { name = "start_dir_x",         type = "both_particle",     selector = "leading_shower" },
    { name = "start_dir_y",         type = "both_particle",     selector = "leading_shower" },
    { name = "start_dir_z",         type = "both_particle",     selector = "leading_shower" },
    #shape
    { name = "number_fragments",    type ="both_particle",      selector = "leading_shower"},
    { name = "start_straightness",  type = "reco_particle",     selector = "leading_shower"},
    { name = "axial_spread",        type = "reco_particle",     selector = "leading_shower"},
    { name = "directional_spread",  type = "reco_particle",     selector = "leading_shower"},
    { name = "vertex_distance",     type = "reco_particle",     selector = "leading_shower"},
    #identifiers
    { name = "primary_softmax",     type = "reco_particle",     selector = "leading_shower"},
    { name = "primary_classification", type = "both_particle",  selector = "leading_shower"},
    { name = "semantic_type",       type = "both_particle",     selector = "leading_shower"},
    { name = "photon_softmax",      type = "reco_particle",     selector = "leading_shower"},
    { name = "electron_softmax",    type = "reco_particle",     selector = "leading_shower"},
    { name = "pid",                 type = "both_particle",     selector = "leading_shower"},

    #subleading shower
    #energy
    { name = "ke",                  type = "both_particle",     selector = "sub_leading_shower" },
    { name = "total_depositions",   type = "both_particle",     selector = "sub_leading_shower"},
    { name = "p",                   type = "both_particle",     selector = "sub_leading_shower"},
    { name = "px",                  type = "both_particle",     selector = "sub_leading_shower"},
    { name = "py",                  type = "both_particle",     selector = "sub_leading_shower"},
    { name = "pz",                  type = "both_particle",     selector = "sub_leading_shower"},
    { name = "start_dedx",          type = "reco_particle",     selector = "sub_leading_shower"},
    #positioning
    { name = "start_x",             type = "both_particle",     selector = "sub_leading_shower" },
    { name = "start_y",             type = "both_particle",     selector = "sub_leading_shower" },
    { name = "start_z",             type = "both_particle",     selector = "sub_leading_shower" },
    { name = "end_x",               type = "both_particle",     selector = "sub_leading_shower" },
    { name = "end_y",               type = "both_particle",     selector = "sub_leading_shower" },
    { name = "end_z",               type = "both_particle",     selector = "sub_leading_shower" },
    { name = "start_dir_x",         type = "both_particle",     selector = "sub_leading_shower" },
    { name = "start_dir_y",         type = "both_particle",     selector = "sub_leading_shower" },
    { name = "start_dir_z",         type = "both_particle",     selector = "sub_leading_shower" },
    #shape
    { name = "number_fragments",    type ="both_particle",      selector = "sub_leading_shower"},
    { name = "start_straightness",  type = "reco_particle",     selector = "sub_leading_shower"},
    { name = "axial_spread",        type = "reco_particle",     selector = "sub_leading_shower"},
    { name = "directional_spread",  type = "reco_particle",     selector = "sub_leading_shower"},
    { name = "vertex_distance",     type = "reco_particle",     selector = "sub_leading_shower"},
    #identifiers
    { name = "primary_softmax",     type = "reco_particle",     selector = "sub_leading_shower"},
    { name = "primary_classification", type = "both_particle",  selector = "sub_leading_shower"},
    { name = "semantic_type",       type ="both_particle",      selector = "sub_leading_shower"},
    { name = "photon_softmax",      type = "reco_particle",     selector = "sub_leading_shower"},
    { name = "electron_softmax",    type = "reco_particle",     selector = "sub_leading_shower"},
    { name = "pid",                 type = "both_particle",     selector = "sub_leading_shower"},
]

