[parameters]
photon_threshold = 20.0
photon_low = 10.0
electron_threshold = 10.0
electron_low = 1.0
muon_threshold = 100.0
muon_low = 1.0
pion_threshold = 130.0
pion_low = 1.0
proton_threshold = 25.0
proton_low = 1.0


[general]
output = "/exp/sbnd/data/users/mdonnach/medulla_produce/single_photon_v2/pion_cut_test"
#output = "/pnfs/sbnd/scratch/users/mdonnach/single_shower_1e20_reweighted_output/single_shower_v2_rewighted_1e20"
primfn = "default_primary_classification"
pidfn = "default_pid"
fsthresh = [
    "@photon_threshold",
    "@electron_threshold",
    "@muon_threshold",
    "@pion_threshold",
    "@proton_threshold",
]

# SBND sample
[[sample]]
name = "simulation"
path = "/pnfs/sbnd/persistent/users/mueller/MCP2025B/simulation/mc5e18/input00*-reweighted.flat.caf.root"
#path = "/pnfs/sbnd/persistent/users/sc5303/gen2/mc/anl/flatcaf/*.flat.caf.root"
#path = "/pnfs/sbnd/scratch/users/mueller/test_gen2/flatcaf/*.flat.caf.root"
#path = "/pnfs/sbnd/persistent/users/mueller/MCP2025B/simulation/mc5e18/input*.flat.root"
#path = "/pnfs/sbnd/persistent/users/mueller/MCP2025B/simulation/mc1e20/input*.flat.root"
#path = "/pnfs/sbnd/persistent/users/mueller/MCP2025B/simulation/mc1e20/input197-reweighted.flat.caf.root"
#path = "root://fndca1.fnal.gov:1094//pnfs/sbnd/persistent/users/mueller/MCP2025B/simulation/mc1e20/input*-reweighted.flat.caf.root"
#path = "/pnfs/sbnd/scratch/users/mueller/MCP2025B/gen1_updated_training/03162026/input*.flat.root"
ismc = true
disable = false # Optional: default = falses


[[tree]]  #True single photon selection
name = "no_pions"
sim_only = true
mode = "true"
cut = [
    { name = "single_photon_deposited_cut",             type = "true",  parameters = [ "@photon_threshold"  ] },
    { name = "no_electrons_inclusive",                  type = "true",  parameters = [ "@electron_threshold" ]},
    { name = "no_charged_pions_inclusive",              type = "true",  parameters = [ "@pion_threshold" ]},
    { name = "no_muon_inclusive",                       type = "true",  parameters = [ "@muon_threshold" ]},
    { name = "contained_fip_cut_depot",                 type = "true"},
    { name = "neutrino",                                type = "true"}
]
branch = [

    #interaction
    { name = "interaction_id",                          type = "both"},
    { name = "photon_multiplicity_inclusive",           type = "both", parameters = [ "@photon_threshold" ]},
    { name = "photon_depot_multiplicity_inclusive",     type = "true", parameters = [ "@photon_threshold" ]},
    { name = "electron_multiplicity_inclusive",         type = "both", parameters = ["@electron_threshold"]},
    { name = "pion_multiplicity_inclusive",             type = "both", parameters = [ "@pion_threshold" ]},
    { name = "proton_multiplicity_inclusive",           type = "both", parameters = [ "@proton_threshold" ]},
    { name = "muon_multiplicity_inclusive",             type = "both", parameters = ["@muon_threshold"]},
    { name = "electron_multiplicity_inclusive_low",     type = "both", parameters = ["@electron_low"]},
    { name = "pion_multiplicity_inclusive_low",         type = "both", parameters = [ "@pion_low" ]},
    { name = "proton_multiplicity_inclusive_low",       type = "both", parameters = [ "@proton_low" ]}
]

[[tree]]  #True single photon selection
name = "yes_pions"
sim_only = true
mode = "true"
cut = [
    { name = "single_photon_deposited_cut",             type = "true",  parameters = [ "@photon_threshold"  ] },
    { name = "no_electrons_inclusive",                  type = "true",  parameters = [ "@electron_threshold" ]},
    { name = "no_muon_inclusive",                       type = "true",  parameters = [ "@muon_threshold" ]},
    { name = "contained_fip_cut_depot",                 type = "true"},
    { name = "neutrino",                                type = "true"}
]
branch = [

    #interaction
    { name = "interaction_id",                          type = "both"},
    { name = "photon_multiplicity_inclusive",           type = "both", parameters = [ "@photon_threshold" ]},
    { name = "photon_depot_multiplicity_inclusive",     type = "true", parameters = [ "@photon_threshold" ]},
    { name = "electron_multiplicity_inclusive",         type = "both", parameters = ["@electron_threshold"]},
    { name = "pion_multiplicity_inclusive",             type = "both", parameters = [ "@pion_threshold" ]},
    { name = "proton_multiplicity_inclusive",           type = "both", parameters = [ "@proton_threshold" ]},
    { name = "muon_multiplicity_inclusive",             type = "both", parameters = ["@muon_threshold"]},
    { name = "electron_multiplicity_inclusive_low",     type = "both", parameters = ["@electron_low"]},
    { name = "pion_multiplicity_inclusive_low",         type = "both", parameters = [ "@pion_low" ]},
    { name = "proton_multiplicity_inclusive_low",       type = "both", parameters = [ "@proton_low" ]}
]