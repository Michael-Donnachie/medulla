[parameters]
photon_threshold = 20.0
photon_low = 10.0
electron_threshold = 10.0
electron_low = 1.0
muon_threshold = 100.0
muon_low = 1.0
pion_threshold = 130.0
pion_low = 1.0
proton_threshold = 25.0
proton_low = 1.0

[general]
#output = "/exp/sbnd/data/users/mdonnach/medulla_produce/single_photon_v2/selection/single_shower_v2_rewighted_1e20"
#output = "/pnfs/sbnd/scratch/users/mdonnach/single_shower_1e20_reweighted_output/single_shower_v2_rewighted_newdedx_nodepot"
output = "/exp/sbnd/data/users/mdonnach/medulla_produce/single_photon_v2/deposition_investigation/true_15ke_single_photon_notreweight"
primfn = "default_primary_classification"
pidfn = "default_pid"
fsthresh = [
    "@photon_threshold",
    "@electron_threshold",
    "@muon_threshold",
    "@pion_threshold",
    "@proton_threshold",
]

# SBND sample
[[sample]]
name = "simulation"
path = "/pnfs/sbnd/persistent/users/mueller/MCP2025B/simulation/mc5e18/input*.flat.root"
ismc = true
disable = false # Optional: default = falses


[[tree]]  #True single photon selection
name = "photon_true_neutrino"
sim_only = true
mode = "true"
cut = [
    { name = "single_photon_observed_cut",              type = "true",  parameters = [15 ] },
    { name = "no_electrons_inclusive",                  type = "true",  parameters = [ "@electron_threshold" ]},
    { name = "no_charged_pions_inclusive",              type = "true",  parameters = [ "@pion_threshold" ]},
    { name = "no_muon_inclusive",                       type = "true",  parameters = [ "@muon_threshold" ]},
    { name = "contained_fip_cut",                       type = "true"},
    { name = "neutrino",                                type = "true"}
]
branch = [
    #leading shower
    #energy
    { name = "ke",                  type = "both_particle",     selector = "leading_shower" },
    { name = "total_depositions",   type = "both_particle",     selector = "leading_shower"},
    { name = "ke",                  type = "both_particle",     selector = "leading_photon" },
    { name = "total_depositions",   type = "both_particle",     selector = "leading_photon"},
]