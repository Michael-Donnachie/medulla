[parameters]
photon_threshold = 10.0
electron_threshold = 10.0
muon_threshold = 25.0
pion_threshold = 25.0
proton_threshold = 25.0
containment_margin = 1.0  # inset margin (cm) for contained_gore_fip_cut
mctruth_threshold = 0.0  # KE threshold (MeV) for the GENIE-level *_srtruth counters



[general]
output = "/exp/sbnd/data/users/mdonnach/medulla_produce/inclusive_1g/test_new_definition/selection_AR23.root"
primfn = "default_primary_classification"
pidfn = "default_pid"
fsthresh = [
    "@photon_threshold",
    "@electron_threshold",
    "@muon_threshold",
    "@pion_threshold",
    "@proton_threshold",
]

[[include_samples]]
file = "common/osc.toml"
keys = [
    "sbnd_ar23p_mc1e20"
]
enable = [
    "sbnd_ar23p_mc1e20"
]


